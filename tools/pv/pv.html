<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>kaneed-dungeon v0.6.0 PV</title>
<style>
  :root {
    --bg0: #110f18; --bg1: #1b1529; --ink: #f4f1fa; --sub: #b9b2c9; --dim: #7d7690;
    --accent: #ff9a3c; --accent2: #ffb86b; --link: #6cb6ff; --ok: #4ade80; --panel: #17141f;
    --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    --mono: Menlo, "Hiragino Sans", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg0); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden;
    background: radial-gradient(120% 90% at 20% 0%, #2a1d3d 0%, rgba(0,0,0,0) 55%),
                radial-gradient(90% 80% at 100% 100%, #2b1a1a 0%, rgba(0,0,0,0) 60%),
                linear-gradient(160deg, var(--bg1), var(--bg0)); }
  .abs { position: absolute; }
  #term { position: absolute; left: 0; top: 0; }
  .chapter { position: absolute; font-weight: 700; letter-spacing: .18em; color: var(--accent); font-size: 13px; }
  .heading { position: absolute; font-weight: 800; color: var(--ink); letter-spacing: .01em; line-height: 1.25; }
  .sub { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; text-align: center; font-weight: 600;
    color: #fff; background: rgba(12,10,18,.72); border-radius: 10px; line-height: 1.5; padding: 8px 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  #progress { position: absolute; left: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--accent), #ff5fa2); }
  .win { position: absolute; border-radius: 12px; overflow: hidden; background: #1f1d26;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }
  .win .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #2a2833;
    color: #d8d4e2; font-size: 13px; font-weight: 600; }
  .win .dot { width: 12px; height: 12px; border-radius: 50%; }
  .win .bar .t { flex: 1; text-align: center; margin-right: 54px; }
  .finder .body { display: flex; height: calc(100% - 34px); }
  .finder .side { width: 30%; background: #24222c; padding: 14px 12px; font-size: 15px; color: #a9a3b8; }
  .finder .side div { padding: 5px 8px; border-radius: 6px; }
  .finder .side .on { background: rgba(108,182,255,.18); color: #e8f2ff; }
  .finder .list { flex: 1; font-size: 17px; }
  .finder .hdr, .finder .row { display: grid; grid-template-columns: 1.6fr 1.3fr .7fr .9fr; padding: 8px 16px; }
  .finder .hdr { color: #8f89a0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .finder .row { color: #ece8f4; }
  .finder .row:nth-child(odd) { background: rgba(255,255,255,.025); }
  .finder .row.sel { background: #2f6fd6; color: #fff; }
  .finder .ico { display: inline-block; width: 15px; height: 18px; margin-right: 8px; vertical-align: -4px; border-radius: 2px;
    background: linear-gradient(#f4f4f6, #d9d9e0); position: relative; }
  .finder .ico::after { content: "TS"; position: absolute; left: 1px; bottom: 2px; font-size: 7px; font-weight: 800; color: #2f6fd6; }
  .finder .ico.sh::after { content: "SH"; color: #555; }
  .editor .tabs { display: flex; background: #1b1a21; font-size: 13px; }
  .editor .tab { padding: 9px 18px; color: #e9e6f2; background: #24222b; border-top: 2px solid var(--accent); }
  .editor .crumb { font-size: 12px; color: #8f89a0; padding: 6px 16px; background: #24222b; }
  .editor .code { font-family: var(--mono); font-size: 16px; line-height: 1.62; padding: 6px 0; background: #1e1c24; height: 100%; }
  .editor .ln { display: flex; white-space: pre; }
  .editor .ln .n { width: 56px; text-align: right; padding-right: 18px; color: #5f5a6e; flex: none; }
  .editor .ln.hit { background: rgba(255,154,60,.16); box-shadow: inset 3px 0 0 var(--accent); }
  .editor .ln.hit .n { color: var(--accent2); }
  .k { color: #c792ea; } .s { color: #c3e88d; } .c { color: #6f6a80; font-style: italic; } .f { color: #82aaff; } .ty { color: #ffcb6b; }
  .browser .url { margin: 8px 12px; padding: 7px 14px; border-radius: 16px; background: #15141a; color: #c9c4d6; font-size: 13px; }
  .browser .page { background: #0f1117; height: 100%; padding: 26px 34px; }
  .browser h1 { font-size: 26px; font-weight: 600; color: #e6edf3; line-height: 1.35; }
  .browser h1 span { color: #7d8590; font-weight: 400; }
  .browser .state { display: inline-flex; align-items: center; gap: 6px; margin: 14px 0 18px; padding: 5px 14px; border-radius: 20px;
    background: #8957e5; color: #fff; font-size: 14px; font-weight: 600; }
  .browser .meta { color: #7d8590; font-size: 14px; margin-left: 10px; }
  .browser .card { border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  .browser .card .h { background: #161b22; color: #7d8590; font-size: 13px; padding: 9px 14px; border-bottom: 1px solid #30363d; }
  .browser .card .b { padding: 14px 18px; color: #e6edf3; font-size: 15px; line-height: 1.7; }
  .browser .card .b h3 { font-size: 17px; margin-bottom: 6px; }
  .cursor { position: absolute; width: 26px; height: 32px; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid var(--accent2); pointer-events: none; }
  .hl { position: absolute; border-radius: 6px; border: 2px solid var(--accent); box-shadow: 0 0 22px rgba(255,154,60,.55), inset 0 0 10px rgba(255,154,60,.25); pointer-events: none; }
  .pill { position: absolute; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .key { position: absolute; padding: 10px 18px; border-radius: 12px; background: #f1edf8; color: #1b1529; font-weight: 800;
    font-size: 30px; box-shadow: 0 6px 0 #b9b1c8, 0 14px 30px rgba(0,0,0,.4); }
  .card { position: absolute; }
  .rules { background: rgba(23,20,31,.92); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 18px 22px; }
  .rules .r { display: flex; align-items: center; gap: 12px; font-size: 17px; padding: 7px 0; color: #ece8f4; }
  .rules .r b { display: inline-block; min-width: 132px; color: var(--accent2); font-weight: 700; }
  .rules .r i { font-style: normal; color: var(--sub); }
  .logo { position: absolute; font-weight: 900; letter-spacing: -.02em; white-space: nowrap; }
  .logo .a { color: #fff; } .logo .b { color: var(--accent); }
  .tag { position: absolute; font-weight: 700; color: #fff; white-space: nowrap; }
  .tag em { font-style: normal; color: var(--accent); }
  .cmd { position: absolute; font-family: var(--mono); background: #0d0c12; border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
    color: #e8e4f2; padding: 16px 22px; white-space: pre; }
  .cmd .p { color: var(--accent); }
  .fine { position: absolute; color: var(--dim); text-align: center; white-space: nowrap; }
  img.px { image-rendering: pixelated; position: absolute; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="term"></canvas>
  <div id="layer"></div>
  <div id="progress"></div>
</div>
<script>
// ---------- parameters ----------
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1600), H = +(Q.get('h') || 900);
const PORTRAIT = H > W;
const ASSETS = Q.get('assets') ? 'file://' + Q.get('assets') : 'assets';
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const layer = document.getElementById('layer');
const progress = document.getElementById('progress');
const term = document.getElementById('term');
term.width = W * 2; term.height = H * 2; term.style.width = W + 'px'; term.style.height = H + 'px';
const tctx = term.getContext('2d');

// ---------- data (set by the renderer) ----------
let FR = null, DATA = null, TIMING = null;

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, x) => a + (b - a) * x;
const seg = (t, a, b) => clamp((t - a) / (b - a));

// ---------- terminal rendering (offscreen per frame, at 2x) ----------
const CW = 19, CH = 40;      // a cell at 2x
const DEF_FG = '#d7d3e0', DEF_BG = '#15131c';
const cache = new Map();
function rowText(f, r) { return f.rows[r].map(c => c[0]).join(''); }
function findRow(f, needle, from = 0) { for (let r = from; r < f.rows.length; r++) if (rowText(f, r).includes(needle)) return r; return -1; }
function termCanvas(name) {
  if (cache.has(name)) return cache.get(name);
  const f = FR[name];
  const cols = f.rows[0].length, rows = f.rows.length;
  const cv = document.createElement('canvas');
  cv.width = cols * CW; cv.height = rows * CH;
  const g = cv.getContext('2d');
  g.fillStyle = DEF_BG; g.fillRect(0, 0, cv.width, cv.height);
  g.textBaseline = 'middle';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const [ch, fg0, bg0, fl, link] = f.rows[r][c];
      const x = c * CW, y = r * CH;
      const fg = fg0 || DEF_FG, bg = bg0;
      if (bg) { g.fillStyle = bg; g.fillRect(x, y, CW + .5, CH + .5); }
      if (!ch || ch === ' ') continue;
      g.globalAlpha = (fl & 2) ? .5 : 1;
      g.fillStyle = fg; g.strokeStyle = fg;
      if (ch === '▀') { g.fillRect(x, y, CW + .5, CH / 2); }
      else if (ch === '▄') { g.fillRect(x, y + CH / 2, CW + .5, CH / 2); }
      else if (ch === '█') { g.fillRect(x, y, CW + .5, CH + .5); }
      else if (ch === '─') { g.fillRect(x, y + CH / 2 - 1, CW + .5, 2); }
      else if (ch === '│') { g.fillRect(x + CW / 2 - 1, y, 2, CH + .5); }
      else if ('╭╮╰╯'.includes(ch)) {
        g.lineWidth = 2; g.beginPath();
        const cx = x + CW / 2, cy = y + CH / 2, rr = CW / 2;
        if (ch === '╭') { g.moveTo(x + CW, cy); g.arcTo(cx, cy, cx, y + CH, rr); g.lineTo(cx, y + CH); }
        if (ch === '╮') { g.moveTo(x, cy); g.arcTo(cx, cy, cx, y + CH, rr); g.lineTo(cx, y + CH); }
        if (ch === '╰') { g.moveTo(cx, y); g.arcTo(cx, cy, x + CW, cy, rr); g.lineTo(x + CW, cy); }
        if (ch === '╯') { g.moveTo(cx, y); g.arcTo(cx, cy, x, cy, rr); g.lineTo(x, cy); }
        g.stroke();
      } else {
        const wide = c + 1 < cols && f.rows[r][c + 1][0] === '';
        g.font = `${(fl & 1) ? 'bold ' : ''}${(fl & 4) ? 'italic ' : ''}${wide ? 35 : 31}px Menlo, "Hiragino Sans"`;
        if (wide) { g.textAlign = 'center'; g.fillText(ch, x + CW, y + CH / 2 + 1); g.textAlign = 'left'; }
        else g.fillText(ch, x, y + CH / 2 + 1);
        if ((fl & 8) || link >= 0) { g.globalAlpha *= (link >= 0 ? .55 : 1); g.fillRect(x, y + CH - 6, (wide ? 2 : 1) * CW, 2); }
      }
      g.globalAlpha = 1;
    }
  }
  cache.set(name, cv);
  return cv;
}
// cell rect of a link run whose href contains `needle` (first run), in cell units
function linkCells(name, needle) {
  const f = FR[name];
  const li = f.links.findIndex(h => h.includes(needle));
  if (li < 0) return null;
  for (let r = 0; r < f.rows.length; r++) {
    let c0 = -1, c1 = -1;
    for (let c = 0; c < f.rows[r].length; c++) if (f.rows[r][c][4] === li) { if (c0 < 0) c0 = c; c1 = c; }
    if (c0 >= 0) return { r, c0, c1: c1 + 1 };
  }
  return null;
}

// camera: draw crop (cells c0..c1, r0..r1) of frame `name` into box (x,y,w,h in px) — contain, top-left anchored
let CAM = null;
function drawTerm(name, crop, box, opts = {}) {
  const cv = termCanvas(name);
  const sw = (crop.c1 - crop.c0) * CW, sh = (crop.r1 - crop.r0) * CH;
  const s = Math.min(box.w / (sw / 2), box.h / (sh / 2));   // px per (2x) unit … in css px
  const dw = sw / 2 * s, dh = sh / 2 * s;
  const dx = box.x + (box.w - dw) / 2, dy = box.y + (opts.top ? 0 : (box.h - dh) / 2);
  tctx.save();
  tctx.globalAlpha = opts.alpha ?? 1;
  if (opts.blur) tctx.filter = `blur(${opts.blur * 2}px)`;
  // panel
  const pad = 14 * s / 1.6 + 6;
  if (!opts.noPanel) {
    tctx.fillStyle = DEF_BG; tctx.shadowColor = 'rgba(0,0,0,.55)'; tctx.shadowBlur = 60;
    roundRect(tctx, (dx - pad) * 2, (dy - pad - 26) * 2, (dw + pad * 2) * 2, (dh + pad * 2 + 26) * 2, 24); tctx.fill();
    tctx.shadowBlur = 0;
    ['#ff5f57', '#febc2e', '#28c840'].forEach((col, i) => { tctx.fillStyle = col; tctx.beginPath(); tctx.arc((dx - pad + 20 + i * 20) * 2, (dy - pad - 10) * 2, 11, 0, 7); tctx.fill(); });
  }
  tctx.drawImage(cv, crop.c0 * CW, crop.r0 * CH, sw, sh, dx * 2, dy * 2, dw * 2, dh * 2);
  tctx.restore();
  CAM = { name, crop, dx, dy, k: dw / (crop.c1 - crop.c0), kh: dh / (crop.r1 - crop.r0) };
  return CAM;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
// screen rect of cells (after drawTerm)
function cellRect(cells) {
  const { dx, dy, k, kh, crop } = CAM;
  return { x: dx + (cells.c0 - crop.c0) * k, y: dy + (cells.r - crop.r0) * kh, w: (cells.c1 - cells.c0) * k, h: kh };
}
const lerpCrop = (a, b, x) => ({ c0: lerp(a.c0, b.c0, x), c1: lerp(a.c1, b.c1, x), r0: lerp(a.r0, b.r0, x), r1: lerp(a.r1, b.r1, x) });

// ---------- DOM helpers (rebuilt every frame) ----------
function el(html, style = {}, cls = '') {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.innerHTML = html;
  Object.assign(d.style, style);
  layer.appendChild(d);
  return d;
}
const px = v => v + 'px';
function cursor(x, y, press = 0) {
  el(`<svg viewBox="0 0 26 32" width="26" height="32"><path d="M2 2 L2 26 L8.5 20 L13 30 L17 28 L12.5 18.5 L21 18.5 Z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg>`,
    { left: px(x - 3), top: px(y - 2), transform: `scale(${1 - press * .15})`, transformOrigin: '3px 2px' }, 'cursor');
}
function ripple(x, y, p) {
  if (p <= 0 || p >= 1) return;
  const r = 10 + 46 * eout(p);
  el('', { left: px(x - r), top: px(y - r), width: px(r * 2), height: px(r * 2), opacity: 1 - p }, 'ripple');
}
function hl(rect, a, padX = 6, padY = 3) {
  if (a <= 0) return;
  el('', { left: px(rect.x - padX), top: px(rect.y - padY), width: px(rect.w + padX * 2), height: px(rect.h + padY * 2), opacity: a }, 'hl');
}
function textBlock(cls, html, style) { return el(html, style, cls); }

// ---------- layout ----------
const L = PORTRAIT
  ? { pad: 36, chapterY: 64, headY: 88, headSize: 34, headW: 648, termBox: { x: 36, y: 250, w: 648, h: 520 }, subY: 1112, subSize: 24, subW: 650 }
  : { pad: 64, chapterY: 46, headY: 70, headSize: 36, headW: 1300, termBox: { x: 64, y: 160, w: 1000, h: 560 }, subY: 790, subSize: 22, subW: 1240 };

function chapter(label, title, a) {
  if (a <= 0) return;
  textBlock('chapter', label, { left: px(L.pad), top: px(L.chapterY), opacity: a });
  textBlock('heading', title, { left: px(L.pad), top: px(L.headY + (1 - eout(a)) * 12), fontSize: px(L.headSize), width: px(L.headW), opacity: a });
}
function subtitle(text, a) {
  if (!text || a <= 0) return;
  textBlock('sub', text, { top: px(L.subY), fontSize: px(L.subSize), maxWidth: px(L.subW), opacity: a });
}

// ---------- windows ----------
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hiTs(line) {
  const t = esc(line);
  if (/^\s*(\/\/|\*|\/\*\*)/.test(line)) return `<span class="c">${t}</span>`;
  return t.replace(/(\/\/.*$)/, '<span class="c">$1</span>')
    .replace(/('[^']*'|`[^`]*`)/g, '<span class="s">$1</span>')
    .replace(/\b(export|function|const|let|return|if|else|of|for|new|undefined|type)\b/g, '<span class="k">$1</span>')
    .replace(/\b(linkify|linkifyPlain|splitFences|protectRe|hold|escapeLabel|hrefOf|map|join|replace|push|get|trim)\b(?=\()/g, '<span class="f">$1</span>')
    .replace(/\b(string|LinkifyOptions|ReadonlyMap|LinkDest|RegExp)\b/g, '<span class="ty">$1</span>');
}
function bar(title) {
  return `<div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="t">${title}</span></div>`;
}
function finder(dir, items, selected, box, a) {
  if (a <= 0) return;
  const side = ['kaneed-dungeon-claudemod', ...dir.split('/')].map((d, i, arr) => `<div class="${i === arr.length - 1 ? 'on' : ''}">${'&nbsp;'.repeat(i * 2)}📁 ${d}</div>`).join('');
  const rows = items.map(it => `<div class="row ${it.name === selected ? 'sel' : ''}"><span><i class="ico ${it.name.endsWith('.sh') ? 'sh' : ''}"></i>${it.name}</span><span>${it.mtime}</span><span>${(it.size / 1024).toFixed(1)} KB</span><span>${it.name.endsWith('.sh') ? 'シェルスクリプト' : 'TypeScript'}</span></div>`).join('');
  winBox('finder', bar(dir.split('/').pop()) + `<div class="body"><div class="side">${side}</div><div class="list"><div class="hdr"><span>名前</span><span>変更日</span><span>サイズ</span><span>種類</span></div>${rows}</div></div>`, box, a);
}
function editor(box, a, hit = 245, pulse = 0) {
  if (a <= 0) return;
  const lines = DATA.code.filter(([n]) => n >= hit - (PORTRAIT ? 7 : 9) && n <= hit + (PORTRAIT ? 9 : 11));
  const code = lines.map(([n, l]) => `<div class="ln ${n === hit ? 'hit' : ''}" style="${n === hit ? `background:rgba(255,154,60,${.12 + .14 * pulse})` : ''}"><span class="n">${n}</span><span>${hiTs(l) || ' '}</span></div>`).join('');
  winBox('editor', bar('linkify.ts — kaneed-dungeon-claudemod') + `<div class="tabs"><div class="tab">linkify.ts</div></div><div class="crumb">hooks › links › linkify.ts › linkify</div><div class="code">${code}</div>`, box, a);
}
function browser(box, a) {
  if (a <= 0) return;
  const is = DATA.issue;
  winBox('browser', bar('') + `<div class="url">github.com/aieo-product/kaneed-dungeon-claudemod/issues/50</div><div class="page">
    <h1>${esc(is.title)} <span>#50</span></h1>
    <div><span class="state">✓ Closed</span><span class="meta">${is.author.login} opened this issue · issue #50</span></div>
    <div class="card"><div class="h">${is.author.login} commented</div><div class="b"><h3>背景・目的</h3>
    #44 で会話中のリンクを「Links」タブに一覧できるようになったが、transcript（会話ログ）の中のディレクトリパスや #47 のようなリンクワードは、その場でクリックしても開けない。</div></div></div>`, box, a);
}
function winBox(cls, html, box, a) {
  const y = box.y + (1 - eout(a)) * 40;
  el(html, { left: px(box.x), top: px(y), width: px(box.w), height: px(box.h), opacity: clamp(a * 1.4), transform: `scale(${.96 + .04 * eout(a)})` }, 'win ' + cls);
}

// ---------- scenes ----------
// each: id, narr (wav name), sub (caption), min (s). The narration starts LEAD s into the scene.
const LEAD = 0.35, TAIL = 0.75;
const SCENES = [
  { id: 'hook', narr: '00-hook', sub: 'Claude の返信に出てきたフォルダやファイル。開くたびに、パスをコピーしていませんか？', min: 7.2 },
  { id: 'title', narr: '01-title', sub: 'そこで、kaneed-dungeon 0.6。会話ログの中のパスが、クリックで開けるようになりました。', min: 7.5 },
  { id: 'walk', narr: '02-walk', sub: 'Claude の作業中は、いつもどおりカニードがダンジョンを探索。返信が届くと、パスがリンクになっています。', min: 9 },
  { id: 'dir', narr: '03-dir', sub: 'フォルダのパスをクリックすると、Finder で開きます。', min: 6.5 },
  { id: 'file', narr: '04-file', sub: 'コードはエディタで開き、行番号つきなら、その行へまっすぐ飛びます。', min: 7.5 },
  { id: 'issue', narr: '05-issue', sub: 'issue の番号や URL は、ブラウザで開きます。', min: 6.5 },
  { id: 'safe', narr: '06-safe', sub: 'スクリプトは実行されないよう、入っているフォルダまで。リンクになるのは、実在するパスだけです。', min: 8.5 },
  { id: 'cta', narr: '07-cta', sub: '設定はいりません。アップデートして、再起動するだけ。会話から、すぐ開こう。', min: 8 },
];
let PLAN = null, TOTAL = 0;
function plan() {
  let t = 0;
  PLAN = SCENES.map(s => {
    const nd = TIMING[s.narr] || 5;
    const dur = Math.max(s.min, LEAD + nd + TAIL);
    const p = { ...s, t0: t, dur, nd };
    t += dur;
    return p;
  });
  TOTAL = t;
  return { total: TOTAL, scenes: PLAN.map(p => ({ id: p.id, narr: p.narr, t0: p.t0, dur: p.dur, nstart: p.t0 + LEAD })) };
}

// sound cues (absolute seconds), filled while planning each scene's timings
function cues() {
  const c = [];
  const at = (id, rel, name) => { const p = PLAN.find(s => s.id === id); c.push({ t: p.t0 + rel, se: name }); };
  at('hook', 3.9, 'click'); at('hook', 4.9, 'pop');
  at('title', 0.15, 'chime');
  at('walk', WALK_SWITCH(), 'pop');
  at('dir', 1.45, 'click'); at('dir', 1.7, 'whoosh');
  at('file', 1.45, 'click'); at('file', 1.7, 'whoosh');
  at('issue', 1.45, 'click'); at('issue', 1.7, 'whoosh');
  at('safe', 2.3, 'click'); at('safe', 2.55, 'whoosh');
  const cta = PLAN.find(s => s.id === 'cta'); c.push({ t: cta.t0 + cta.dur - 2.6, se: 'chime' });
  return c;
}
const WALK_SWITCH = () => { const p = PLAN.find(s => s.id === 'walk'); return p.dur * 0.55; };

// frames
let WORK = [], DONE = 'done', GAME_DONE = 0;
function prep() {
  WORK = Object.keys(FR).filter(k => k.startsWith('work_')).sort();
  GAME_DONE = findRow(FR.done, '[ Game ]');
}
function cropReply(name) {
  const f = FR[name];
  const r0 = findRow(f, '⏺ リンクの書き換え');
  return { r0: r0 - .05, r1: r0 + 6.2 };
}
function bandCrop(name) {
  const g = findRow(FR[name], '[ Game ]');
  return { c0: 0, c1: 120, r0: g - 1, r1: g + 13 };
}
function wholeCrop() {           // reply + band + prompt, statusline cut
  const f = FR.done; const ran = findRow(f, 'Ran 1 shell');
  const pr = findRow(f, '❯', findRow(f, '[ Game ]'));
  return { c0: 0, c1: 120, r0: ran - .3, r1: pr + 1.1 };
}
const replyCrop = (cols) => { const r = cropReply('done'); return { c0: 0, c1: cols, r0: r.r0, r1: r.r1 }; };

function sceneLocal(t) {
  for (const p of PLAN) if (t < p.t0 + p.dur) return [p, t - p.t0];
  const p = PLAN[PLAN.length - 1]; return [p, p.dur];
}

// a click on a link of the done frame: cursor travel, press, ripple; returns the link's screen rect
function clickLink(lt, needle, tMove = .2, tClick = 1.45) {
  const cells = linkCells('done', needle);
  const r = cellRect(cells);
  const tx = r.x + Math.min(r.w * .45, 90), ty = r.y + r.h * .55;
  const sx = PORTRAIT ? W * .8 : W * .62, sy = PORTRAIT ? H * .62 : H * .78;
  const m = ease(seg(lt, tMove, tClick - .15));
  const press = lt > tClick - .05 && lt < tClick + .12 ? 1 : 0;
  hl(r, eout(seg(lt, tClick - .5, tClick)));
  cursor(lerp(sx, tx, m), lerp(sy, ty, m), press);
  ripple(tx, ty, seg(lt, tClick, tClick + .55));
  return r;
}

function render(t) {
  layer.innerHTML = '';
  tctx.clearRect(0, 0, term.width, term.height);
  const [p, lt] = sceneLocal(t);
  const fadeIn = eout(seg(lt, 0, .35)), fadeOut = 1 - seg(lt, p.dur - .3, p.dur);
  const a = Math.min(fadeIn, fadeOut);
  progress.style.width = px(W * clamp(t / TOTAL));
  const subA = Math.min(eout(seg(lt, LEAD - .1, LEAD + .25)), 1 - seg(lt, p.dur - .35, p.dur - .1));
  const TB = L.termBox;
  // terminal box for the link scenes: reply rows zoomed
  const replyCols = PORTRAIT ? 46 : 52;

  if (p.id === 'hook') {
    const blur = 1 - ease(seg(lt, 2.8, 3.4));
    const crop = replyCrop(replyCols);
    const box = PORTRAIT ? { x: 28, y: 470, w: 664, h: 360 } : { x: 120, y: 230, w: 1360, h: 470 };
    drawTerm('done', crop, box, { blur: 6 * blur, alpha: .35 + .65 * (1 - blur) });
    // big question
    const q = 1 - ease(seg(lt, 2.6, 3.1));
    if (q > 0) {
      const sz = PORTRAIT ? 54 : 70;
      textBlock('heading', 'このパス、', { left: 0, width: px(W), textAlign: 'center', top: px(H * (PORTRAIT ? .3 : .26)), fontSize: px(sz), opacity: q * eout(seg(lt, .1, .5)) });
      textBlock('heading', '<span style="color:var(--accent)">どうやって開いてる？</span>', { left: 0, width: px(W), textAlign: 'center', top: px(H * (PORTRAIT ? .3 : .26) + sz * 1.3), fontSize: px(sz), opacity: q * eout(seg(lt, 1.0, 1.4)) });
    }
    if (lt > 3.0) {
      // select the text of hooks/links/ and copy
      const cells = linkCells('done', '/hooks/links');
      const r = cellRect(cells);
      const sel = ease(seg(lt, 3.5, 4.2));
      el('', { left: px(r.x), top: px(r.y), width: px(r.w * sel), height: px(r.h), background: 'rgba(80,140,255,.45)', borderRadius: '3px' }, 'abs');
      cursor(lerp(r.x - 10, r.x + r.w * sel, ease(seg(lt, 3.2, 4.2))), r.y + r.h * .6, lt > 3.45 && lt < 3.6 ? 1 : 0);
      const k = eout(seg(lt, 4.8, 5.1));
      if (k > 0) textBlock('key', '⌘ C', { left: px(r.x + r.w + 30), top: px(r.y - 70 + (1 - k) * 20), opacity: k });
      const n = eout(seg(lt, 5.4, 5.8));
      if (n > 0) textBlock('pill', '→ ターミナルで <span style="font-family:var(--mono)">open hooks/links/</span> …', { left: px(CAM.dx), top: px(CAM.dy + (CAM.crop.r1 - CAM.crop.r0) * CAM.kh + 34), background: 'rgba(40,34,54,.95)', border: '1px solid rgba(255,255,255,.15)', color: '#ddd', opacity: n, fontSize: px(PORTRAIT ? 16 : 18) });
    }
  }

  if (p.id === 'title') {
    const sz = PORTRAIT ? 64 : 104;
    const ty = PORTRAIT ? H * .36 : H * .36;
    const la = eout(seg(lt, .1, .6));
    textBlock('chapter', 'CLAUDE CODE MOD', { left: 0, width: px(W), textAlign: 'center', top: px(ty - sz * .55), opacity: la, fontSize: px(PORTRAIT ? 13 : 15) });
    el('<span class="a">kaneed-</span><span class="b">dungeon</span>', { left: 0, width: px(W), textAlign: 'center', top: px(ty + (1 - la) * 20), fontSize: px(sz), opacity: la * a }, 'logo');
    const va = eout(seg(lt, .7, 1.1));
    textBlock('pill', 'v0.6.0', { left: px(W / 2 - 40), top: px(ty + sz * 1.3), background: 'var(--accent)', color: '#1b1529', opacity: va * a, fontSize: px(PORTRAIT ? 18 : 22) });
    const tg = eout(seg(lt, 1.3, 1.8));
    textBlock('tag', '会話ログのパスを、<em>クリックで開く。</em>', { left: 0, width: px(W), textAlign: 'center', top: px(ty + sz * 1.3 + (PORTRAIT ? 60 : 70)), fontSize: px(PORTRAIT ? 28 : 34), opacity: tg * a });
    // Kaneed walking along the bottom
    const frame = Math.floor(lt * 4) % 2 ? 'walk_1' : 'walk_0';
    const s = PORTRAIT ? 6 : 7;
    const kx = lerp(-24 * s, W + 24 * s, seg(lt, 0, p.dur));
    el(`<img class="px" src="${ASSETS}/${frame}.png" style="width:${24 * s}px;height:${16 * s}px;left:0;top:0">`, { left: px(kx), top: px(PORTRAIT ? H * .72 : H * .74), opacity: a }, 'abs');
  }

  if (p.id === 'walk') {
    const sw = WALK_SWITCH();
    chapter('KANEED-DUNGEON', '作業中はダンジョン探索、<br>返信ではパスがリンクに', a);
    const box = PORTRAIT ? { x: 20, y: 300, w: 680, h: 600 } : { x: 120, y: 200, w: 1360, h: 540 };
    if (lt < sw) {
      const i = Math.min(WORK.length - 1, Math.floor(lt / sw * WORK.length));
      const name = WORK[i];
      const bc = bandCrop(name);
      drawTerm(name, PORTRAIT ? { ...bc, c1: 88 } : bc, box, { alpha: a });
    } else {
      const x = ease(seg(lt, sw, sw + .8));
      const whole = wholeCrop();
      const crop = PORTRAIT ? { ...whole, c1: 74 } : whole;
      drawTerm('done', crop, box, { alpha: a });
      // links shimmer one after another
      ['/hooks/links\u0000', 'linkify.ts#L245', 'kaneed-design.md', '/scripts', '/issues/50', '/releases/tag'].forEach((n, i) => {
        const cells = linkCells('done', n.replace('\u0000', ''));
        if (!cells || cells.c0 >= crop.c1) return;
        const r = cellRect({ ...cells, c1: Math.min(cells.c1, crop.c1) });
        const k = seg(lt, sw + .6 + i * .22, sw + .9 + i * .22);
        hl(r, k * (1 - seg(lt, p.dur - .6, p.dur - .2)), 4, 2);
      });
    }
  }

  const replyBox = PORTRAIT ? { x: 30, y: 262, w: 660, h: 300 } : { x: 88, y: 190, w: 700, h: 330 };
  if (['dir', 'file', 'issue', 'safe'].includes(p.id)) {
    const titles = {
      dir: ['01 — フォルダ', 'フォルダは <span style="color:var(--accent)">Finder</span> で開く'],
      file: ['02 — コード', 'コードはエディタの、<span style="color:var(--accent)">その行</span>へ'],
      issue: ['03 — ISSUE と URL', '<span style="color:var(--accent)">#50</span> も URL も、ブラウザで'],
      safe: ['04 — 安全', 'スクリプトは<span style="color:var(--accent)">実行しない</span>'],
    }[p.id];
    chapter(titles[0], titles[1], a);
    drawTerm('done', replyCrop(replyCols), replyBox, { alpha: a, top: true });
    const winA = (s) => eout(seg(lt, s, s + .5)) * fadeOut;
    const WB = PORTRAIT ? { x: 24, y: 610, w: 672, h: 430 } : { x: 740, y: 290, w: 800, h: 450 };
    if (p.id === 'dir') {
      clickLink(lt, '/hooks/links');
      finder('hooks/links', DATA.links, '', WB, winA(1.65));
    }
    if (p.id === 'file') {
      clickLink(lt, 'linkify.ts#L245');
      editor(PORTRAIT ? { ...WB, h: 470 } : { ...WB, y: 250, h: 500 }, winA(1.65), 245, .5 + .5 * Math.sin(lt * 5));
      const ba = eout(seg(lt, 2.6, 3.0)) * fadeOut;
      if (ba > 0) textBlock('pill', '<span style="font-family:var(--mono)">code -g linkify.ts:245</span>', { left: px(WB.x + WB.w - (PORTRAIT ? 270 : 300)), top: px((PORTRAIT ? WB.y : 250) - 46), background: 'rgba(255,154,60,.18)', color: 'var(--accent2)', border: '1px solid rgba(255,154,60,.5)', opacity: ba });
    }
    if (p.id === 'issue') {
      clickLink(lt, '/issues/50');
      browser(PORTRAIT ? { ...WB, h: 470 } : { ...WB, y: 270, h: 470 }, winA(1.65));
    }
    if (p.id === 'safe') {
      const r = clickLink(lt, '/scripts', .2, 2.3);
      const tip = eout(seg(lt, 1.2, 1.6)) * (1 - seg(lt, 2.2, 2.4));
      if (tip > 0) textBlock('pill', 'release.sh → <b>scripts/</b> を開く（実行しない）', { left: px(r.x), top: px(r.y - 44), background: '#2a2236', color: '#fff', border: '1px solid var(--accent)', opacity: tip, fontSize: px(PORTRAIT ? 14 : 16) });
      const fb = PORTRAIT ? { ...WB, h: 220 } : { ...WB, y: 250, h: 250 };
      finder('scripts', DATA.scripts, 'release.sh', fb, winA(2.5));
      const ra = eout(seg(lt, 3.6, 4.1)) * fadeOut;
      if (ra > 0) {
        const rb = PORTRAIT ? { x: 24, y: 848, w: 672 } : { x: 700, y: 530, w: 840 };
        el(`<div class="r"><b>📁 フォルダ</b><i>Finder で開く</i></div>
            <div class="r"><b>📝 コード・設定</b><i>エディタで、その行へ</i></div>
            <div class="r"><b>🖼 画像・PDF</b><i>既定のビューアで</i></div>
            <div class="r"><b>🔗 #N・URL</b><i>ブラウザで</i></div>
            <div class="r"><b>⛔ スクリプト</b><i>入っているフォルダまで</i></div>`,
          { left: px(rb.x), top: px(rb.y + (1 - ra) * 16), width: px(rb.w), opacity: ra, fontSize: px(PORTRAIT ? 15 : 17) }, 'card rules');
      }
    }
  }

  if (p.id === 'cta') {
    const ca = eout(seg(lt, .1, .6)) * fadeOut;
    textBlock('chapter', 'UPDATE', { left: 0, width: px(W), textAlign: 'center', top: px(H * (PORTRAIT ? .22 : .2)), opacity: ca });
    const cmd = 'claude plugin update kaneed-dungeon@kaneed-dungeon';
    const n = Math.floor(cmd.length * seg(lt, .5, 2.2));
    const fs = PORTRAIT ? 15 : 22;
    const cw = cmd.length * fs * .61 + 70;
    el(`<span class="p">$</span> ${cmd.slice(0, n)}<span style="opacity:${Math.floor(lt * 3) % 2 ? 1 : 0}">▌</span>`, { left: px((W - cw) / 2), top: px(H * (PORTRAIT ? .27 : .26)), width: px(cw), fontSize: px(fs), opacity: ca }, 'cmd');
    const la = eout(seg(lt, 2.4, 2.9)) * fadeOut;
    const sz = PORTRAIT ? 54 : 76;
    const ly = H * (PORTRAIT ? .45 : .47);
    el('<span class="a">kaneed-</span><span class="b">dungeon</span>', { left: 0, width: px(W), textAlign: 'center', top: px(ly), fontSize: px(sz), opacity: la }, 'logo');
    textBlock('tag', '会話から、<em>すぐ開こう。</em>', { left: 0, width: px(W), textAlign: 'center', top: px(ly + sz * 1.35), fontSize: px(PORTRAIT ? 26 : 32), opacity: la });
    const fa = eout(seg(lt, 3.2, 3.7)) * fadeOut;
    const fine = ['Claude Code 2.1.293 以降 · フルスクリーン表示なら単クリック、それ以外は ⌘ クリック',
      'MIT License · github.com/aieo-product/kaneed-dungeon-claudemod',
      'Voice: Irodori-TTS v4-Large (Gemma Terms of Use) · Music &amp; SE: original'];
    fine.forEach((s, i) => textBlock('fine', s, { left: 0, width: px(W), top: px(ly + sz * 1.35 + (PORTRAIT ? 70 : 80) + i * (PORTRAIT ? 26 : 30)), fontSize: px(i === 0 ? (PORTRAIT ? 13 : 16) : (PORTRAIT ? 12 : 14)), opacity: fa, color: i === 0 ? 'var(--sub)' : 'var(--dim)', whiteSpace: PORTRAIT ? 'normal' : 'nowrap', padding: '0 20px' }));
    const s = PORTRAIT ? 5 : 6;
    const frame = Math.floor(lt * 3) % 2 ? 'idle_1' : 'idle_0';
    el(`<img class="px" src="${ASSETS}/${lt > 3 ? 'victory' : frame}.png" style="width:${24 * s}px;height:${16 * s}px;left:0;top:0">`, { left: px(W / 2 - 12 * s), top: px(ly - 16 * s - 14), opacity: la }, 'abs');
  }

  subtitle(p.sub, subA);
}

window.PV = {
  async init(frames, data, timing) {
    FR = frames; DATA = data; TIMING = timing; prep();
    const info = plan();
    // fonts and images ready
    await document.fonts.ready;
    await Promise.all(['idle_0', 'idle_1', 'walk_0', 'walk_1', 'victory'].map(n => new Promise(r => { const i = new Image(); i.onload = r; i.onerror = r; i.src = `${ASSETS}/${n}.png`; })));
    return { ...info, cues: cues() };
  },
  render,
};
</script>
